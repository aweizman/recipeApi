spark-swagger {
  theme="FLATTOP"
  deepLinking=false
  defaultModelsExpandDepth=1
  defaultModelExpandDepth=1
  defaultModelRendering="example"
  displayOperationId=false
  displayRequestDuration=true
  docExpansion="FULL"
  filter=false
  operationsSorter="alpha"
  showExtensions=false
  showCommonExtensions=false
  tagsSorter="alpha"

;     TODO: change host to actual host name.
  host="ec2-34-194-167-76.compute-1.amazonaws.com"
  basePath="/recipe"
  info {
    title="Recipe API"
    description="A recipe API powered by Spark Java Framework"
    version="${project.version}"
    termsOfService=""
    schemes=["HTTP","HTTPS"]
    project {
      groupId="${project.groupId}"
      artifactId="${project.artifactId}"
      version="${project.version}"
    }
  }
}